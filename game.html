<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>game — carol.zone</title>
  <link rel="icon" href="/images/star.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background: linear-gradient(-45deg, #fae8b6, #f7c9d4, #d8e6f2, #f3f0c7);
      background-size: 400% 400%;
      animation: shift 90s ease infinite;

      color: #222222;
    }

    @keyframes shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .page {
      max-width: 720px;
      margin: 40px auto 80px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .small {
      font-size: 18px;
      color: #777;
    }

    a {
      color: #222222;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .spacer {
      height: 24px;
    }

    /* Game container: centered, subtle, “card-like” but still spare */
    .game-shell {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.30);
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
      border: 1px solid rgba(34, 34, 34, 0.10);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Fullscreen-ish on smaller screens */
    @media (max-width: 720px) {
      .game-shell {
        aspect-ratio: 9 / 16;
      }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>game</h1>
    <p class="small">
      <a href="art.html">← foggy field</a>
    </p>

    <div class="spacer"></div>

    <div class="game-shell">
      <!-- The Flickgame export file should be in the same directory as this game.html -->
      <iframe
        src="moon_flickgame-20250110+1334.html"
        title="Flickgame"
        allow="fullscreen; gamepad; autoplay"
      ></iframe>
    </div>

    <div class="spacer"></div>

    <p class="small">Tip: click inside the game to focus keyboard input.</p>
  </div>
</body>
</html>
