<script id="flickgame_base.js">
  // Flick Game JavaScript Library
// Extracted shared functions from HTML files

// Global variables
var gameState;

// Helper function to get URL parameters
function getParameterByName(name) {
    var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
        results = regex.exec(location.search);
    return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
}

// Helper function to strip http/https from URLs
function strip_http(url) {
   url = url.replace(/^https?:\/\//,'');
   return url;
}

// Helper function to qualify URLs
function qualifyURL(url) {
    var aurl = document.createElement('a');
    aurl.href = url;
    return aurl.href;
}

// RLE decode function
function RLE_decode(encoded) {
    var output = "";
    for (var i=0;i<encoded.length;i+=2) {
      var count = encoded[i];
      var ch = encoded[i+1];
      for (var j=0;j<count;j++){
        output+=ch;
      }
    }
    return output;
}



// Generic getData function that can be used by both player and editor
function getData(options) {
    options = options || {};
    var onSuccess = options.onSuccess || function(code) {};
    var onError = options.onError || console.log;
    var onEmbedded = options.onEmbedded || function(code) {};

    // Handle embedded data
    if (typeof embeddedDat !== 'undefined' && embeddedDat[0] !== '_') {
        embeddedDat = decodeURI(embeddedDat);
        onEmbedded(embeddedDat);
        return true;
    }

    // Get ID from URL parameter
    var id = getParameterByName("p").replace(/[\\\/]/, "");
    if (id === null || id.length === 0) {
        // onError("No ID specified in URL.");
        return false;
    }

    // Choose URL based on whether to use proxy
    var url = "https://ded.increpare.com/cgi-bin/gist_proxy.py?id=" + id;
    
    // this instead to use the GitHub API directly (which is broken because of https://github.com/increpare/flickgame/issues/77 )
    // url = 'https://api.github.com/gists/' + id;
    
    var httpClient = new XMLHttpRequest();
    httpClient.open('GET', url);
    httpClient.onreadystatechange = function() {
        if (httpClient.readyState != 4) {
            return;
        }

        var code;        
        
        // Handle proxy response
        if (httpClient.status === 200) {
            try {
                var response = JSON.parse(httpClient.responseText);
                if (response.error) {
                    onError("Proxy error: " + response.error);
                    return;
                } else if (response.content) {
                    code = response.content;
                } else {
                    onError("Invalid proxy response");
                    return;
                }
            } catch (e) {
                onError("Failed to parse proxy response");
                return;
            }
        } else {
            onError("Proxy request failed with status " + httpClient.status);
            return;
        }
    

        // Call success callback with the loaded code
        onSuccess(code);
    }
    
    httpClient.send();
    return true;
}

</script>

  function calcHeatmap(cal,col,fromCal){
    var map = []
    var stack = []
    var c = hex[col]

    //initialize
    for (var j=0;j<100;j++){
      for (var i=0;i<160;i++){
        if (cal[i+160*j]===c){
          var entry = [0,i,j]
          map.push([0,i,j])
          stack.push([i,j,0,i,j])
        } else {
          map.push(null)
        }
      }
    }

    //should replace this with a center of mass calculation from the old one
    if (stack.length===0){
      var cx=0;
      var cy=0;
      var count=0;
      for (var i=0;i<160;i++){
        for (var j=0;j<100;j++){
          if (fromCal[i+160*j]===c){
            cx+=i;
            cy+=j;
            count++;
          }
        }
      }
      if (count>0){
        cx=Math.round(cx/count);
        cy=Math.round(cy/count);
        for (var j=0;j<100;j++){
          for (var i=0;i<160;i++){
            map[i+160*j]=[0,cx,cy];
          }
        }
      }
    }

    //propagate
    while(stack.length>0){
      var entry = stack.shift();
      //[fromx,fromy,dist,tox,toy]
      var x0=entry[0];
      var y0=entry[1];
      var d0=entry[2];
      var xtarget=entry[3];
      var ytarget=entry[4];
      var d1=d0+1;
      var neighbours = [[x0-1,y0],[x0+1,y0],[x0,y0-1],[x0,y0+1]];
      for (var i=0;i<4;i++){
        var n = neighbours[i];
        var nx=n[0];
        var ny=n[1];
        if (nx<0||ny<0||nx>=160||ny>=100){
          continue;
        }
        var existing = map[nx+160*ny];
        if (existing===null||d1<existing[0]){
          map[nx+160*ny]=[d1,xtarget,ytarget]
          stack.push([nx,ny,d1,xtarget,ytarget])
        }
      }
    }

    return map;
  }

            var target = targetHeatMap[i+160*j];
            var tx = target[1];
            var ty = target[2];
            particles.push([i,j,tx,ty])
          }
        }
      }
    }
  }

          var xt = Math.round(x0+progress*dx)
          var yt = Math.round(y0+progress*dy)
          frame[xt+160*yt]=c;
        }
      }
    }
    return frame;
  }

      curCanvasToDraw=printCanvas(curAnimationFrames[animationIndex])[0];
      redraw();
      animationIndex++;
      if (animationIndex<curAnimationFrames.length){
        setTimeout(drawNextFrame,1000*animationLength/frameCount);
      } else {
        animating=false;
      }
  }
  var animationIndex=1;
  function doAnimation(){
    animating=true;
    animationIndex=1;
    drawNextFrame();
  }

  function mouseDown(e){
    mouseMove(e);
    if (target>0){
      if (showAnimation){
        transition(currentIndex,target-1);
        currentIndex=target-1;
        doAnimation();
      } else {
        currentIndex=target-1;
        redraw();        
      }
      mouseMove(e);
    } 
  }
  function mouseMove(e){

    if (gameState==null){
      return;
    }
    var coords = getCoords(e);

    var w = mainCanvasCtx.width;
    var h = mainCanvasCtx.height;
    var wd = w/160.0;
    var hd = h/100.0;
    zoom=1;
    if (wd<hd){
      zoom=wd;//Math.floor(wd);
    } else {
      zoom=hd;//Math.floor(hd);
    }
    if(zoom<1){
      zoom=1;
    }
    var dx=(w-160*zoom)/2;
    var dy=(h-100*zoom)/2;

    var x=Math.floor((coords[0]-dx)/zoom);
    var y=Math.floor((coords[1]-dy)/zoom);
    target=0;
    if(x>=0&&x<160&&y>=0&&y<100) {
      var ch = gameState.imageDats[currentIndex][x+160*y];
      var colIndex = parseInt(ch,16);
      target=gameState.hyperlinks[currentIndex][colIndex];

      if (gameState.hyperlinks[currentIndex][colIndex]!=0) {
        mainCanvas.style.cursor="pointer";        
      } else {
        mainCanvas.style.cursor="default";        
      }

    } else {
      mainCanvas.style.cursor="default";
    }
    
  }


function get_page_data() {
    return getData({
        onSuccess: function(code) {
            loadState(code);
            
            var homepage = gameState.gameLink;
            var homepageLink = document.getElementById("homeLink");
            if (homepageLink) {
                homepageLink.innerHTML = strip_http(homepage);
                if (!homepage.match(/^https?:\/\//)) {
                    homepage = "http://" + homepage;
                }
                homepageLink.href = homepage;
            }
      
            var hacklink = document.getElementById("hackLink");
            if (hacklink) {
                var id = getParameterByName("p").replace(/[\\\/]/, "");
                var url = "index.html?p=" + id;
                url = qualifyURL(url);
                hacklink.href = url;
                hacklink.innerHTML = "&sdotb; edit";
            }
            
            // Call renderImages if it exists
            if (typeof renderImages === 'function') {
                renderImages();
            }
        },
        onEmbedded: function(code) {
            loadState(code);
            
            var homepageLink = document.getElementById("homeLink");
            if (homepageLink) {
                homepageLink.textContent = gameState.gameLink;
            }
            
            renderImages();
        }
    });
}


var mainCanvas;
var mainCanvasCtx;
var mainCanvasContainer;
function init(){
  window.addEventListener('resize', redraw, false);


  mainCanvas=document.getElementById("mainCanvas");
  mainCanvasCtx=mainCanvas.getContext("2d");
  mainCanvasContainer=document.getElementById("content");

  mainCanvas.addEventListener('mousemove', mouseMove,false);
  mainCanvas.addEventListener('mousedown', mouseDown,false);

  redraw();

  get_page_data();

}








 var colorPalette = [];

var images = new Array();
var imageCtxts = new Array();

function printCanvas(descriptionString){
    var canvas = document.createElement('canvas');
    canvas.width="160";
    canvas.height="100";
    var ctx=canvas.getContext("2d");
    for (var j=0;j<descriptionString.length;j++){
      var x = j%160;
      var y = Math.floor(j/160);
      var ch=descriptionString[j];
      var colIndex = parseInt(ch,16);
      ctx.fillStyle=colorPalette[colIndex];
      ctx.fillRect(x,y,1,1);
    }
    return [canvas,ctx];
}

function renderImages(){
  gameState.imageDats = new Array();

  for (var i=0;i<16;i++){
    var descriptionArray = gameState.canvasses[i];
    var descriptionString = RLE_decode(descriptionArray);

    var canvas_context=printCanvas(descriptionString);
    var canvas=canvas_context[0];
    var ctx=canvas_context[1];

    gameState.imageDats.push(descriptionString);
    images.push(canvas);
    imageCtxts.push(ctx);
  }
  redraw();
}

function goFullscreen(evt){    
  evt = evt || window.event;
 if (evt.keyCode===70) { //f
    var elem = document.getElementById("mainCanvas");
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    } else if (elem.mozRequestFullScreen) {
      elem.mozRequestFullScreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    }
  }
}
document.addEventListener("keydown", goFullscreen);
